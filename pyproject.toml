[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpit601-recourse"
version = "0.1.0"
description = "Feasibility-aware counterfactual recourse for frozen JIT software defect predictors."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.16.3",
    "scikit-learn==1.6.1",
    "imbalanced-learn==0.14.2",
    "joblib==1.6.0",
    "dice-ml==0.12",
    "raiutils==0.4.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpit601_recourse = [
    "_data/configs/*.json",
    "_data/reconstruction_spec.json",
    "_data/assets/*.json",
    "_data/assets/*.joblib",
]
